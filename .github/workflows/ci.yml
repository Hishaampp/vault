name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint (TypeScript + strict accessibility rules)
        run: npm run lint
      - name: Tests (engine, UI, accessibility, security, live multi-process cluster)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high